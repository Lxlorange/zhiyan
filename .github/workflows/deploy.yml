name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || '22' }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
    steps:
      - name: Check deploy configuration
        shell: bash
        run: |
          missing=0
          if [ -z "$SERVER_HOST" ]; then
            echo "::error::SERVER_HOST is empty. Add it in GitHub Settings -> Secrets and variables -> Actions."
            missing=1
          fi
          if [ -z "$SERVER_USER" ]; then
            echo "::error::SERVER_USER is empty. Add it in GitHub Settings -> Secrets and variables -> Actions."
            missing=1
          fi
          if [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::SERVER_SSH_KEY is empty. Add the private SSH key in GitHub Actions Secrets."
            missing=1
          fi
          exit "$missing"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          script_stop: true
          script: |
            cd /opt/zhiyan/A3
            git fetch --all --prune
            git checkout master
            git pull --ff-only origin master
            docker compose -f docker-compose.prod.yml --env-file .env.production build backend
            docker compose -f docker-compose.prod.yml --env-file .env.production build frontend
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d
            docker image prune -f
