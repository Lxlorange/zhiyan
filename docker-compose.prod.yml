services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zhiyan-a3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhiyan_a3}
      POSTGRES_USER: ${POSTGRES_USER:-zhiyan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhiyan} -d ${POSTGRES_DB:-zhiyan_a3}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        USE_CN_MIRROR: "true"
        APT_MIRROR: mirrors.aliyun.com
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
        INSTALL_CJK_FONTS: ${INSTALL_CJK_FONTS:-false}
    container_name: zhiyan-a3-backend
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      APP_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 18000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zhiyan}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-zhiyan_a3}
      TESSERACT_CMD: /usr/bin/tesseract
      LIBREOFFICE_PATH: /usr/bin/libreoffice
    volumes:
      - backend_generated:/app/generated
      - backend_uploads:/app/uploaded_knowledge
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    container_name: zhiyan-a3-frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2.8-alpine
    container_name: zhiyan-a3-caddy
    restart: unless-stopped
    environment:
      APP_SITE_ADDRESS: ${APP_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  backend_generated:
  backend_uploads:
  caddy_data:
  caddy_config:
